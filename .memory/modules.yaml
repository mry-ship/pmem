# pmem 模块目录：模块是“业务单元”而不是目录，一个模块可以拥有多个路径。
# 首次划分：在 Cursor 里对 Agent 说“按 pmem-bootstrap 技能划分模块”。之后新增模块直接在这里加。
#
# modules:
#   gameplay.Jigsaw:
#     paths: ["Assets/Game/Jigsaw/**", "Assets/UI/JigsawPanel/**"]
#     aliases: [Puzzle]            # 别名，写入/检索时自动归一
#     entities: [Reward, Config]   # 模块内常用议题
# candidates: 冷门目录，先登记路径，有记忆写入后再转为正式模块
# third_party / ignored: 第三方 SDK、示例、生成代码，不参与闸门
schema_version: 1
categories:
  feature:
    label: 业务功能
  infra:
    label: 技术底座
entities:
  Encoding: [编码, 乱码, gbk, bom]
  Performance: [性能, 耗时, latency]
  Ranking: [排序, 打分, score]
synonyms:
  - [闸门, 拦截, gate]
  - [过期, 失效, stale]
modules:
  feature.Gate:
    description: Hooks 闸门：改代码前按模块拦截、读代码附摘要、问答审查、结束提醒、终端写命令识别
    paths: [src/pmem/hooks/**, src/pmem/cli/hook_cmd.py, tests/hooks/**, tests/fixtures/hook_payloads/**, tests/test_hook_cmd.py, spike/cursor_hooks/**]
    aliases: [Hooks, Hook]
    entities: [Encoding, Payload, State, ShellParse, AutoAnchors, PromptReview, HookLatency]
  feature.Retrieval:
    description: 检索：索引与缓存、分词、同义词、嵌入、排序、过期核对（stale）与知识图谱
    paths: [src/pmem/index/**, src/pmem/cli/reindex_cmd.py, tests/index/**, scripts/eval_retrieval.py, tests/fixtures/eval/**]
    aliases: [Index, Search]
    entities: [Ranking, Embedding, Tokenize, StaleCheck, Supersede]
  feature.Tools:
    description: 记忆服务层：MemoryService 与 5 个 MCP 工具背后的业务规则（写入校验、检索参数、核对、状态变更、图谱出参）
    paths: [src/pmem/service/**, src/pmem/server/app.py, src/pmem/core/secrets.py, tests/test_service.py, tests/test_server.py, scripts/smoke_mcp.py]
    aliases: [Mcp, Service]
    entities: [Record, Search, Secrets, Status, Similar]
  infra.Watchdog:
    description: MCP 服务看门狗：pmem serve 守护 serve --worker 子进程，崩溃、超时、代码更新时自动重启并重新握手
    paths: [src/pmem/server/watchdog.py, tests/test_watchdog.py]
    aliases: [Server, 看门狗]
  feature.ModuleCatalog:
    description: 模块目录：modules.yaml 的解析与路径映射（core/registry.py），以及迁移、同步、覆盖率（catalog 包）和对应命令
    paths: [src/pmem/core/registry.py, src/pmem/catalog/**, src/pmem/cli/migrate_cmd.py, src/pmem/cli/sync_cmd.py, tests/core/test_registry_*.py, tests/core/conftest.py, tests/test_migrate.py, tests/test_migrate_split.py, tests/test_sync.py]
    aliases: [Registry, Catalog]
    entities: [Migrate, Split, Deprecate, Loading, NameMatch]
  feature.Storage:
    description: 记忆文件存储与 Git/SVN 适配
    paths: [src/pmem/storage/**, src/pmem/vcs/**, tests/storage/**, tests/vcs/**, tests/conftest.py]
    aliases: [Vcs, Files]
    components: [Files, Git, Svn]
  feature.Onboarding:
    description: 接入：init 生成的规则、技能、Hooks、MCP 配置模板，scan 目录与热度扫描，doctor 自检
    paths: [src/pmem/cli/init_cmd.py, src/pmem/cli/doctor_cmd.py, src/pmem/generate/templates.py, src/pmem/scan/**, tests/test_cli_flow.py]
    aliases: [Init, Doctor, Scan]
    entities: [Skills, Hooks, Rule, Doctor, Scan]
  feature.Wiki:
    description: 从记忆生成可浏览的 Markdown Wiki（每模块一页、过期标记、写入后自动更新）
    paths: [src/pmem/generate/wiki.py, src/pmem/cli/wiki_cmd.py, tests/test_wiki.py]
  feature.Metrics:
    description: 度量与报告：本机事件日志、收益报告 pmem report、引用识别、健康报告 pmem health、对照实验 pmem bench
    paths: [src/pmem/metrics/**, src/pmem/bench/**, tests/metrics/**, tests/bench/**, scripts/calibrate_cite.py, bench/**]
    aliases: [Report, Bench, Health]
    entities: [Events, Citation, Compare, Bench, Health, Contradiction]
  feature.Import:
    description: 从既有记忆系统（LanceDB 参考实现）只读导入
    paths: [src/pmem/importers/**, src/pmem/cli/import_cmd.py, tests/importers/**]
    aliases: [Importer, LanceDB]
  feature.Curation:
    description: 记忆整理：写入质量提示、相近议题、合并零碎记忆、补关联代码、正文断行、种子记忆与归档
    paths: [src/pmem/core/quality.py, src/pmem/cli/compact_cmd.py, src/pmem/cli/anchors_cmd.py, src/pmem/cli/seed_cmd.py, src/pmem/cli/format_cmd.py, tests/core/test_quality.py, tests/test_compact.py, tests/test_anchors_cmd.py, tests/test_lifecycle.py, tests/test_format_cmd.py]
    aliases: [Compact, Quality, Anchors]
    entities: [WriteHints, Merge, Anchors, Seed, Format]
  infra.Model:
    description: 数据模型：记忆条目（类型、状态及其中文名）、ULID、正文断行、配置与默认值
    paths: [src/pmem/core/entry.py, src/pmem/core/ids.py, src/pmem/core/config.py, src/pmem/core/textfmt.py, tests/core/test_entry.py, tests/core/test_ids.py, tests/core/test_config.py, tests/core/test_textfmt.py]
    aliases: [Entry, Config]
  infra.Common:
    description: 命令行入口（main.py 参数解析、--brief 精简输出）与尚未归类的文件；新文件先落在这里，成形后归到对应模块
    paths: [src/pmem/**, tests/**]
    aliases: [Cli]
candidates: {}
third_party: []
ignored: []
