# pmem bench 用例：同一任务分别在“有记忆(on) / 无记忆(off)”下交给 Agent。
# 字段：
#   commit        从哪个提交开始（问题仍存在的版本）
#   prompt        交给 Agent 的任务描述，写法就像真实提需求，不要提示答案
#   setup         Agent 开始前在工作区执行的命令（可选）
#   check         Agent 结束后执行的验收命令，退出码 0 视为通过
#   check_files   验收前才放进工作区的隐藏文件：{工作区内路径: 本仓库内路径}
# on 组使用本仓库当前的 .memory（模拟“前人已经踩过坑”），off 组清空记忆。
model: composer-2.5
repeats: 3
cases:
  - id: gate-guidance
    commit: e258c6e
    prompt: |
      在 Cursor 里试用 pmem 时发现：修改有研发记忆的模块文件会被闸门拦下，但 Agent 只知道“被拦了”，
      不知道接下来具体该做什么，于是反复重试编辑。请修复闸门，让 Agent 被拦时能明确知道下一步该调用什么，
      并保证现有测试通过。
    setup: uv sync -q
    check: uv run -q pytest -q -p no:cacheprovider .bench_check tests/hooks
    check_files:
      .bench_check/test_gate_guidance.py: bench/checks/test_gate_guidance.py
