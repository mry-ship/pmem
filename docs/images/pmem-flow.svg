<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <style>
      .actor { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
      .gate { fill: #fff4e5; stroke: #d97706; stroke-width: 1.5; }
      .actor-text { font-size: 14px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .life { stroke: #c7d2fe; stroke-width: 1.5; }
      .life-gate { stroke: #f5b971; stroke-width: 1.5; }
      .msg { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .reply { stroke: #57606a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .msg-gate { stroke: #d97706; stroke-width: 1.5; fill: none; }
      .reply-gate { stroke: #d97706; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .label { font-size: 13px; fill: #1f2328; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
      .label-gate { font-size: 13px; fill: #9a4d00; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
      .phase-title { font-size: 13px; font-weight: 700; fill: #1f2328; text-anchor: middle; }
      .phase-sub { font-size: 11px; fill: #656d76; text-anchor: middle; }
      .step { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .legend { font-size: 12px; fill: #656d76; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="900" rx="12" fill="#ffffff"/>

  <!-- 环节色带（一眼分区） -->
  <rect x="12" y="78" width="1016" height="88" rx="8" fill="#f6f8fa"/>
  <rect x="12" y="174" width="1016" height="148" rx="8" fill="#eef2ff"/>
  <rect x="12" y="330" width="1016" height="148" rx="8" fill="#fff8ef"/>
  <rect x="12" y="486" width="1016" height="148" rx="8" fill="#eef2ff"/>
  <rect x="12" y="642" width="1016" height="132" rx="8" fill="#f0fdf4"/>

  <!-- 左侧环节标题 -->
  <text class="phase-title" x="72" y="112">接手</text>
  <text class="phase-sub" x="72" y="130">读代码附摘要</text>

  <circle cx="40" cy="236" r="11" fill="#6366f1"/>
  <text class="step" x="40" y="240">1</text>
  <text class="phase-title" x="86" y="232">改前查</text>
  <text class="phase-sub" x="86" y="250">search_memory</text>

  <text class="phase-title" x="72" y="388">改代码</text>
  <text class="phase-sub" x="72" y="406">闸门校验</text>

  <circle cx="40" cy="548" r="11" fill="#6366f1"/>
  <text class="step" x="40" y="552">2</text>
  <text class="phase-title" x="86" y="544">写结论</text>
  <text class="phase-sub" x="86" y="562">record_memory</text>

  <circle cx="40" cy="696" r="11" fill="#6366f1"/>
  <text class="step" x="40" y="700">3</text>
  <text class="phase-title" x="86" y="692">提交共享</text>
  <text class="phase-sub" x="86" y="710">git commit</text>

  <!-- 参与者（顶） -->
  <rect class="actor" x="150" y="18" width="90" height="40" rx="8"/>
  <text class="actor-text" x="195" y="43">你</text>
  <rect class="actor" x="310" y="18" width="110" height="40" rx="8"/>
  <text class="actor-text" x="365" y="43">AI Agent</text>
  <rect class="gate" x="490" y="18" width="110" height="40" rx="8"/>
  <text class="actor-text" x="545" y="43">闸门 Hooks</text>
  <rect class="actor" x="670" y="18" width="110" height="40" rx="8"/>
  <text class="actor-text" x="725" y="43">pmem 服务</text>
  <rect class="actor" x="850" y="18" width="140" height="40" rx="8"/>
  <text class="actor-text" x="920" y="43">仓库 .memory/</text>

  <!-- 生命线 -->
  <line class="life" x1="195" y1="58" x2="195" y2="800"/>
  <line class="life" x1="365" y1="58" x2="365" y2="800"/>
  <line class="life-gate" x1="545" y1="58" x2="545" y2="800"/>
  <line class="life" x1="725" y1="58" x2="725" y2="800"/>
  <line class="life" x1="920" y1="58" x2="920" y2="800"/>

  <!-- ===== 接手 ===== -->
  <text class="label" x="280" y="100">修一下拼图奖励重复发放</text>
  <line class="msg" x1="195" y1="108" x2="363" y2="108" marker-end="url(#arrow)"/>

  <text class="label-gate" x="455" y="132">读 JigsawReward.cs</text>
  <line class="msg-gate" x1="365" y1="140" x2="543" y2="140" marker-end="url(#arrow-gate)"/>
  <text class="label-gate" x="455" y="158">附上该模块的记忆摘要</text>
  <line class="reply-gate" x1="545" y1="166" x2="367" y2="166" marker-end="url(#arrow-gate)"/>

  <!-- ===== ① 改前查 ===== -->
  <text class="label" x="545" y="204">改代码前先查 search_memory（按要改的文件）</text>
  <line class="msg" x1="365" y1="212" x2="723" y2="212" marker-end="url(#arrow)"/>

  <text class="label" x="822" y="246">读 gameplay.Jigsaw 的记忆</text>
  <line class="msg" x1="725" y1="254" x2="918" y2="254" marker-end="url(#arrow)"/>

  <text class="label" x="545" y="288">返回：排除项、根因，并标出需核实的记忆</text>
  <line class="reply" x1="725" y1="296" x2="367" y2="296" marker-end="url(#arrow)"/>

  <!-- ===== 改代码（闸门）===== -->
  <text class="label-gate" x="455" y="360">修改 JigsawReward.cs</text>
  <line class="msg-gate" x1="365" y1="368" x2="543" y2="368" marker-end="url(#arrow-gate)"/>
  <text class="label-gate" x="455" y="398">查过：放行（没查过就拒绝）</text>
  <line class="reply-gate" x1="545" y1="406" x2="367" y2="406" marker-end="url(#arrow-gate)"/>

  <path class="msg" d="M365,430 H410 V452 H367" marker-end="url(#arrow)"/>
  <text class="label" x="420" y="446" style="text-anchor:start">按正确方向修改并验证</text>

  <!-- ===== ② 写结论 ===== -->
  <text class="label" x="545" y="516">得出结论后写入 record_memory</text>
  <line class="msg" x1="365" y1="524" x2="723" y2="524" marker-end="url(#arrow)"/>

  <text class="label" x="822" y="558">按模块写成一个 .md 文件</text>
  <line class="msg" x1="725" y1="566" x2="918" y2="566" marker-end="url(#arrow)"/>

  <text class="label-gate" x="455" y="600">结束时没写记忆就提醒</text>
  <line class="reply-gate" x1="545" y1="608" x2="367" y2="608" marker-end="url(#arrow-gate)"/>

  <!-- ===== ③ 提交共享 ===== -->
  <text class="label" x="280" y="674">完成，并说明依据的记忆</text>
  <line class="reply" x1="365" y1="682" x2="197" y2="682" marker-end="url(#arrow)"/>

  <text class="label" x="555" y="720">git commit / push，队友拉代码后就能查到</text>
  <line class="msg" x1="195" y1="728" x2="918" y2="728" marker-end="url(#arrow)"/>

  <!-- 参与者（底） -->
  <rect class="actor" x="150" y="812" width="90" height="40" rx="8"/>
  <text class="actor-text" x="195" y="837">你</text>
  <rect class="actor" x="310" y="812" width="110" height="40" rx="8"/>
  <text class="actor-text" x="365" y="837">AI Agent</text>
  <rect class="gate" x="490" y="812" width="110" height="40" rx="8"/>
  <text class="actor-text" x="545" y="837">闸门 Hooks</text>
  <rect class="actor" x="670" y="812" width="110" height="40" rx="8"/>
  <text class="actor-text" x="725" y="837">pmem 服务</text>
  <rect class="actor" x="850" y="812" width="140" height="40" rx="8"/>
  <text class="actor-text" x="920" y="837">仓库 .memory/</text>

  <!-- 图例 -->
  <line class="msg-gate" x1="150" y1="872" x2="190" y2="872" marker-end="url(#arrow-gate)"/>
  <text class="legend" x="198" y="876" style="text-anchor:start">橙色 = 闸门自动介入</text>
  <circle cx="400" cy="872" r="8" fill="#6366f1"/>
  <text class="step" x="400" y="876" style="font-size:10px">1</text>
  <text class="legend" x="414" y="876" style="text-anchor:start">蓝底带 = 你指望 Agent 主动做的三步</text>
  <rect x="680" y="864" width="18" height="14" rx="3" fill="#f0fdf4" stroke="#86efac"/>
  <text class="legend" x="706" y="876" style="text-anchor:start">绿底 = 提交后队友可见</text>
</svg>
