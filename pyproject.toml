[project]
name = "pmem"
version = "0.1.0.dev0"
description = "面向项目与团队的 AI 研发记忆系统（Cursor）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pyyaml>=6.0",
    "wcmatch>=10.0",
]

[project.scripts]
pmem = "pmem.cli.main:main"

[project.optional-dependencies]
embed = [
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
